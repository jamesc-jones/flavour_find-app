<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood-Based Recipe Recommender</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-500 via-pink-500 to-red-500">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <header class="text-center text-white mb-8">
            <h1 class="text-4xl md:text-5xl font-bold mb-3 drop-shadow-lg">🍳 Mood-Based Recipe Recommender</h1>
            <p class="text-lg md:text-xl opacity-95">Tell us how you're feeling, and we'll suggest the perfect recipe!</p>
        </header>

        <!-- Mood Selection -->
        <div id="mood-selection" class="bg-white rounded-2xl shadow-2xl p-6 md:p-10 mb-6">
            <h2 class="text-2xl md:text-3xl font-bold text-purple-600 text-center mb-6">How are you feeling today?</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button class="mood-btn flex flex-col items-center justify-center p-6 bg-gradient-to-br from-gray-100 to-gray-200 rounded-xl hover:from-purple-500 hover:to-pink-500 hover:text-white transition-all duration-300 transform hover:-translate-y-2 shadow-lg hover:shadow-2xl" data-mood="happy">
                    <span class="text-4xl mb-2">😊</span>
                    <span class="font-semibold">Happy</span>
                </button>
                <button class="mood-btn flex flex-col items-center justify-center p-6 bg-gradient-to-br from-gray-100 to-gray-200 rounded-xl hover:from-purple-500 hover:to-pink-500 hover:text-white transition-all duration-300 transform hover:-translate-y-2 shadow-lg hover:shadow-2xl" data-mood="sad">
                    <span class="text-4xl mb-2">😢</span>
                    <span class="font-semibold">Sad</span>
                </button>
                <button class="mood-btn flex flex-col items-center justify-center p-6 bg-gradient-to-br from-gray-100 to-gray-200 rounded-xl hover:from-purple-500 hover:to-pink-500 hover:text-white transition-all duration-300 transform hover:-translate-y-2 shadow-lg hover:shadow-2xl" data-mood="stressed">
                    <span class="text-4xl mb-2">😰</span>
                    <span class="font-semibold">Stressed</span>
                </button>
                <button class="mood-btn flex flex-col items-center justify-center p-6 bg-gradient-to-br from-gray-100 to-gray-200 rounded-xl hover:from-purple-500 hover:to-pink-500 hover:text-white transition-all duration-300 transform hover:-translate-y-2 shadow-lg hover:shadow-2xl" data-mood="energetic">
                    <span class="text-4xl mb-2">⚡</span>
                    <span class="font-semibold">Energetic</span>
                </button>
                <button class="mood-btn flex flex-col items-center justify-center p-6 bg-gradient-to-br from-gray-100 to-gray-200 rounded-xl hover:from-purple-500 hover:to-pink-500 hover:text-white transition-all duration-300 transform hover:-translate-y-2 shadow-lg hover:shadow-2xl" data-mood="cozy">
                    <span class="text-4xl mb-2">🛋️</span>
                    <span class="font-semibold">Cozy</span>
                </button>
                <button class="mood-btn flex flex-col items-center justify-center p-6 bg-gradient-to-br from-gray-100 to-gray-200 rounded-xl hover:from-purple-500 hover:to-pink-500 hover:text-white transition-all duration-300 transform hover:-translate-y-2 shadow-lg hover:shadow-2xl" data-mood="adventurous">
                    <span class="text-4xl mb-2">🌍</span>
                    <span class="font-semibold">Adventurous</span>
                </button>
                <button class="mood-btn flex flex-col items-center justify-center p-6 bg-gradient-to-br from-gray-100 to-gray-200 rounded-xl hover:from-purple-500 hover:to-pink-500 hover:text-white transition-all duration-300 transform hover:-translate-y-2 shadow-lg hover:shadow-2xl" data-mood="romantic">
                    <span class="text-4xl mb-2">💕</span>
                    <span class="font-semibold">Romantic</span>
                </button>
                <button class="mood-btn flex flex-col items-center justify-center p-6 bg-gradient-to-br from-gray-100 to-gray-200 rounded-xl hover:from-purple-500 hover:to-pink-500 hover:text-white transition-all duration-300 transform hover:-translate-y-2 shadow-lg hover:shadow-2xl" data-mood="lazy">
                    <span class="text-4xl mb-2">😴</span>
                    <span class="font-semibold">Lazy</span>
                </button>
            </div>
        </div>

        <!-- Recipe Display -->
        <div id="recipe-display" class="bg-white rounded-2xl shadow-2xl p-6 md:p-10 hidden animate-fadeIn">
            <div class="recipe-card">
                <div class="flex flex-col md:flex-row md:justify-between md:items-center mb-6 pb-6 border-b-2 border-gray-200">
                    <h2 id="recipe-name" class="text-2xl md:text-3xl font-bold text-purple-600 mb-2 md:mb-0"></h2>
                    <span id="recipe-mood-badge" class="bg-gradient-to-r from-purple-500 to-pink-500 text-white px-5 py-2 rounded-full text-sm font-semibold capitalize inline-block w-fit"></span>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-[200px_1fr] gap-6 mb-6">
                    <div class="flex items-center justify-center w-full md:w-48 h-48 bg-gradient-to-br from-purple-500 to-pink-500 rounded-xl shadow-lg">
                        <span id="recipe-emoji" class="text-7xl"></span>
                    </div>
                    
                    <div class="recipe-details">
                        <div class="mb-6">
                            <h3 class="text-xl font-bold text-purple-600 mb-3">📝 Description</h3>
                            <p id="recipe-description" class="text-gray-700 leading-relaxed"></p>
                        </div>
                        
                        <div class="mb-6">
                            <h3 class="text-xl font-bold text-purple-600 mb-3">🥘 Ingredients</h3>
                            <ul id="recipe-ingredients" class="list-disc list-inside text-gray-700 space-y-2"></ul>
                        </div>
                        
                        <div class="mb-6">
                            <h3 class="text-xl font-bold text-purple-600 mb-3">👨‍🍳 Instructions</h3>
                            <ol id="recipe-instructions" class="list-decimal list-inside text-gray-700 space-y-2"></ol>
                        </div>
                    </div>
                </div>
                
                <div class="flex flex-col md:flex-row gap-4 justify-center pt-6 border-t-2 border-gray-200">
                    <button id="new-recipe-btn" class="bg-gradient-to-r from-purple-500 to-pink-500 text-white px-8 py-3 rounded-lg font-semibold hover:shadow-lg transform hover:-translate-y-1 transition-all duration-300">
                        Get Another Recipe
                    </button>
                    <button id="back-btn" class="bg-gray-100 text-purple-600 border-2 border-purple-600 px-8 py-3 rounded-lg font-semibold hover:bg-purple-600 hover:text-white transform hover:-translate-y-1 transition-all duration-300">
                        Choose Different Mood
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fadeIn {
            animation: fadeIn 0.5s ease;
        }
    </style>
</body>
</html>
